name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # The real correctness gates. Build is skipped here because it needs a live DB/Redis;
      # run it in a deploy job with those services provisioned.
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Lint
        run: npx next lint
      - name: Unit tests
        run: npx vitest run

  # Vercel-style "push = deploy": once checks pass on main, SSH into the droplet and update the
  # worker. PRs and failed checks never deploy. Serialized so two pushes can't overlap.
  deploy:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: droplet-deploy
      cancel-in-progress: false
    steps:
      # Skip (don't fail) when droplet secrets aren't configured yet — secrets can't be used
      # directly in a job-level `if:`, so gate the SSH step on this check instead.
      - name: Check droplet secrets
        id: cfg
        run: |
          if [ -n "${{ secrets.DROPLET_HOST }}" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::DROPLET_HOST secret not set — skipping droplet deploy."
          fi
      - name: Deploy worker to droplet over SSH
        if: steps.cfg.outputs.ready == 'true'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          # Pull first so deploy.sh itself is present/current, then run it (it re-syncs + restarts).
          script: cd ~/privyr-v2 && git fetch -q origin main && git reset -q --hard origin/main && bash deploy/deploy.sh
